<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D4ED8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Pruebas TTR DIGESA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: una sola columna de captura, navegación de secciones fija arriba y barra de acción fija abajo, pensada para usarse con una mano en campo. */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#141A21; --muted:#5B6673; --line:#D5DBE2;
  --accent:#1D4ED8; --accent-ink:#FFFFFF; --accent-soft:#E3EAFD;
  --ok:#137A3F; --ok-soft:#DDF3E5; --bad:#B42318; --bad-soft:#FDE4E1; --warn:#8A5A00; --warn-soft:#FFF1C7;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1318; --surface:#171E26; --ink:#E6EBF0; --muted:#93A0AE; --line:#2B3541;
  --accent:#7DA2FF; --accent-ink:#0B1020; --accent-soft:#1C2A4A;
  --ok:#5CCB8A; --ok-soft:#173326; --bad:#FF8A7A; --bad-soft:#3A1B18; --warn:#F2C14E; --warn-soft:#3A2F12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1318; --surface:#171E26; --ink:#E6EBF0; --muted:#93A0AE; --line:#2B3541;
  --accent:#7DA2FF; --accent-ink:#0B1020; --accent-soft:#1C2A4A;
  --ok:#5CCB8A; --ok-soft:#173326; --bad:#FF8A7A; --bad-soft:#3A1B18; --warn:#F2C14E; --warn-soft:#3A2F12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
header.top{padding-block:18px 10px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:1.55rem;letter-spacing:.01em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem;margin:0}
.equipos{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;font:500 .85rem var(--f-body);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.nuevo{border-style:dashed;color:var(--accent);border-color:var(--accent)}
nav.secs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:8px 16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.secs a{flex:0 0 auto;text-decoration:none;color:var(--muted);font:600 .78rem var(--f-display);letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:6px}
nav.secs a:hover,nav.secs a:focus-visible{background:var(--accent-soft);color:var(--accent);outline:none}
section.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:16px;padding:16px;scroll-margin-top:60px}
section.sec h2{font-family:var(--f-display);font-weight:600;font-size:1.1rem;margin:0 0 4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
section.sec h2 small{font:500 .75rem var(--f-num);color:var(--muted)}
.hint{color:var(--muted);font-size:.82rem;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 14px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
label,.lbl{font-size:.8rem;font-weight:500;color:var(--muted)}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 10px;width:100%;min-width:0}
input.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input.vacio,textarea.vacio{border-color:var(--warn)}
textarea{min-height:70px;resize:vertical}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:7px;padding:8px 10px;font:500 .85rem var(--f-body);cursor:pointer;min-width:52px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg button.b-ok[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.seg button.b-bad[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.rev{display:grid;grid-template-columns:1fr;gap:10px}
.rev .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-block:6px;border-bottom:1px solid var(--line)}
.rev .row:last-child{border-bottom:0}
.rev .row .lbl{color:var(--ink);font-size:.9rem;flex:1 1 180px}
.rev .seg{flex:0 1 auto}
.tbl{overflow-x:auto;margin-inline:-4px}
table{border-collapse:separate;border-spacing:4px;width:100%;min-width:340px}
th{font:600 .72rem var(--f-display);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:center;padding:2px}
th.rowh{text-align:left;font:500 .8rem var(--f-body);text-transform:none;letter-spacing:0;color:var(--ink);white-space:nowrap}
td input{padding:7px 6px}
td.calc,.calc{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right;color:var(--ink);padding:7px 6px;background:var(--accent-soft);border-radius:7px;white-space:nowrap}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.stat{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:.75rem;color:var(--muted)}
.stat .v{font:500 1.05rem var(--f-num);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font:600 .7rem var(--f-display);letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;width:fit-content}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.na{background:var(--bg);color:var(--muted)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.prog{flex:1 1 100%;min-width:0;display:flex;flex-direction:column;gap:4px}
.prog .t{font-size:.78rem;color:var(--muted)}
.prog .track{height:5px;background:var(--bg);border-radius:3px;overflow:hidden}
.prog .fill{height:100%;background:var(--accent);width:0;transition:width .3s}
.btn{border:0;border-radius:8px;padding:11px 16px;font:600 .95rem var(--f-display);letter-spacing:.02em;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.del{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.bar .btn{flex:1 1 auto}
.btn:disabled{opacity:.5;cursor:default}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:.88rem;z-index:9;max-width:calc(100% - 32px)}
.ejemplo{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:.85rem}
.acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.aviso{position:fixed;left:16px;right:16px;bottom:96px;z-index:10;max-width:560px;margin:0 auto;background:var(--surface);border:1px solid var(--warn);border-radius:10px;padding:14px 16px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.aviso p{margin:6px 0 0;color:var(--muted);font-size:.88rem}
a.btn{text-decoration:none;display:inline-block}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.88rem}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Pruebas básicas a transformador MT</h1>
      <p class="sub">Formato DIGESA · Transformadores de MT</p>
    </div>
    <div class="equipos" id="equipos" role="group" aria-label="Transformadores capturados"></div>
    <div class="ejemplo" id="avisoEjemplo" hidden>Estos son datos de ejemplo. Toca <b>+ Nuevo</b> para capturar un transformador real.</div>
  </header>
  <nav class="secs" id="nav" aria-label="Secciones"></nav>
  <form id="frm" autocomplete="off"></form>
</div>

<div class="bar"><div class="in">
  <div class="prog"><span class="t" id="progT">0 de 0 campos</span><div class="track"><div class="fill" id="progF"></div></div></div>
  <button class="btn sec" id="btnXlsx" type="button">Excel de este TR</button>
  <button class="btn pri" id="btnTodos" type="button">Todos en un Excel</button>
</div></div>
<div class="toast" id="toast" hidden></div>

/* ================= Cálculos ================= */
function calcular(v){
  const o={rel:{},ia:{},ip:{},ref:{},err:null,errF:{},devAT:null,devBT:null};
  for(let p=1;p<=5;p++){const a=num(v[`tap${p}_p`]),b=num(v[`tap${p}_s`]); if(a&&b)o.rel[p]=a/b;}
  const teo=o.rel[v.tapop];
  if(teo){FASES.forEach(([f])=>{const m=num(v[`ttr_rel_${f}`]); if(m!=null)o.errF[f]=(m-teo)/teo*100;});
    const e=Object.values(o.errF); if(e.length)o.err=e.reduce((a,b)=>Math.abs(b)>Math.abs(a)?b:a);}
  const dev=k=>{const xs=FASES.map(([f])=>num(v[`ttr_${k}_${f}`])).filter(x=>x!=null); if(xs.length<2)return null;
    const p=xs.reduce((a,b)=>a+b)/xs.length; return Math.max(...xs.map(x=>Math.abs(x-p)/p*100));};
  o.devAT=dev('rat'); o.devBT=dev('rbt');
  const fc=num(v.ais_fc);
  CONEX.forEach(([cx])=>{const m05=num(v[`ais_${cx}_0.5`]),m1=num(v[`ais_${cx}_1`]),m10=num(v[`ais_${cx}_10`]);
    if(m05&&m1)o.ia[cx]=m1/m05; if(m1&&m10)o.ip[cx]=m10/m1; if(m1&&fc)o.ref[cx]=m1*fc;});
  return o;
}

function b64ToBytes(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
const xmlEsc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
function fechaMX(v){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||'');return m?`${m[3]}/${m[2]}/${m[1]}`:v;}

// Llena una copia de la hoja con los datos de un transformador
function llenarHoja(sh,v,ctx){
  function poner(ref,val,color){
    const re=new RegExp(`<c r="${ref}"(?: s="(\\d+)")?(?: t="\\w+")?\\s*(?:/>|>[\\s\\S]*?</c>)`);
    const m=re.exec(sh); if(!m)return;
    let s=m[1]||'0'; if(color)s=String(ctx.xfCon(s,color));
    let c;
    if(val===null||val===undefined||val==='') c=`<c r="${ref}" s="${s}"/>`;
    else if(typeof val==='number') c=`<c r="${ref}" s="${s}"><v>${val}</v></c>`;
    else c=`<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(val)}</t></is></c>`;
    sh=sh.replace(m[0],c);
  }
  const AM='FFFFFF00', RO='FFFF9999';
  CON_CELDA.forEach(f=>{
    let val=String(v[f.k]??'').trim();
    if(f.k==='obs'&&v.enfr) val='Enfriamiento: '+v.enfr+(val?'. '+val:'');
    if(val===''){poner(f.c,null,AM);return;}
    if(f.tipo==='n'){const n=num(val); poner(f.c,n==null?val:n); return;}
    if(f.tipo==='fecha')val=fechaMX(val);
    poner(f.c,val);
  });
  // La gráfica del formato lee la tabla oculta de la derecha (AJ, AL, AO filas 30-36)
  const GRAF={HXT:'AJ',HX:'AL',XHT:'AO'};
  CONEX.forEach(([cx])=>TIEMPOS.forEach(([t],i)=>{const n=num(v[`ais_${cx}_${t}`]); if(n!=null)poner(GRAF[cx]+(30+i),n);}));
  const o=calcular(v);
  for(let p=1;p<=5;p++) if(o.rel[p]!=null) poner('X'+(29+p),r(o.rel[p],4));
  if(o.err!=null) poner('Z39',r(o.err,3),Math.abs(o.err)>0.5?RO:null);
  if(o.devAT!=null) poner('Z41',r(o.devAT,2),o.devAT>2?RO:null);
  if(o.devBT!=null) poner('Z42',r(o.devBT,2),o.devBT>2?RO:null);
  CONEX.forEach(([cx,,col])=>{
    if(o.ia[cx]!=null) poner(col+'38',r(o.ia[cx],2));
    if(o.ip[cx]!=null) poner(col+'39',r(o.ip[cx],2),o.ip[cx]<1?RO:null);
    if(o.ref[cx]!=null) poner(col+'42',r(o.ref[cx],1));
  });
  return sh;
}

function nombresHojas(lista){
  const usados=new Set();
  return lista.map((v,i)=>{let n=(v.serie||'TR '+(i+1)).replace(/[\[\]\*\?\/\\:]/g,'-').replace(/^'+|'+$/g,'').trim().slice(0,31)||'TR '+(i+1);
    let base=n,k=2; while(usados.has(n.toLowerCase())){const suf=' ('+k+++')'; n=base.slice(0,31-suf.length)+suf;} usados.add(n.toLowerCase()); return n;});
}
const refHoja=n=>`'${n.replace(/'/g,"''")}'`;

// Genera UN archivo con una pestaña por transformador
async function construirXlsx(lista){
  const zip=await JSZip.loadAsync(b64ToBytes(PLANTILLA_B64));
  const base=await zip.file('xl/worksheets/sheet1.xml').async('string');
  const shRels=await zip.file('xl/worksheets/_rels/sheet1.xml.rels').async('string');
  const drw=await zip.file('xl/drawings/drawing1.xml').async('string');
  const drwRels=await zip.file('xl/drawings/_rels/drawing1.xml.rels').async('string');
  const chart=await zip.file('xl/charts/chart1.xml').async('string');
  const prn=await zip.file('xl/printerSettings/printerSettings1.bin').async('uint8array');
  let st=await zip.file('xl/styles.xml').async('string');
  let ct=await zip.file('[Content_Types].xml').async('string');
  let wb=await zip.file('xl/workbook.xml').async('string');
  let wbRels=await zip.file('xl/_rels/workbook.xml.rels').async('string');
  // Formato de moneda (€) de la plantilla → número normal
  st=st.replace(/<numFmt numFmtId="(\d+)" formatCode="[^"]*€[^"]*"\/>/g,'<numFmt numFmtId="$1" formatCode="General"/>');
  const fillIdx={}, xfCache={};
  function addFill(rgb){ if(fillIdx[rgb]!=null)return fillIdx[rgb];
    const n=+/<fills count="(\d+)">/.exec(st)[1];
    st=st.replace(/<fills count="\d+">/,`<fills count="${n+1}">`).replace('</fills>',`<fill><patternFill patternType="solid"><fgColor rgb="${rgb}"/><bgColor indexed="64"/></patternFill></fill></fills>`);
    return fillIdx[rgb]=n; }
  const ctx={xfCon(s,rgb){const key=s+'|'+rgb; if(xfCache[key]!=null)return xfCache[key];
    const fid=addFill(rgb); const m=/<cellXfs count="(\d+)">([\s\S]*?)<\/cellXfs>/.exec(st);
    let x=m[2].match(/<xf\b[^>]*\/>|<xf\b[^>]*>[\s\S]*?<\/xf>/g)[+s||0];
    x=/fillId="\d+"/.test(x)?x.replace(/fillId="\d+"/,`fillId="${fid}"`):x.replace('<xf ',`<xf fillId="${fid}" `);
    x=/applyFill="\d"/.test(x)?x.replace(/applyFill="\d"/,'applyFill="1"'):x.replace('<xf ','<xf applyFill="1" ');
    const n=+m[1]; st=st.replace(m[0],`<cellXfs count="${n+1}">${m[2]}${x}</cellXfs>`); return xfCache[key]=n;}};
  const nombres=nombresHojas(lista);
  const PLANT="'Transformadores de MT'!";
  let sheetsXml='', defNames='';
  lista.forEach((v,i)=>{
    const n=i+1, nom=nombres[i], ref=refHoja(nom);
    let sh=llenarHoja(base,v,ctx);
    if(i>0) sh=sh.replace(/ tabSelected="1"/,'');
    zip.file(`xl/worksheets/sheet${n}.xml`,sh);
    zip.file(`xl/charts/chart${n}.xml`,chart.split(PLANT).join(xmlEsc(ref)+'!'));
    if(i>0){
      zip.file(`xl/worksheets/_rels/sheet${n}.xml.rels`,shRels.replace('drawing1.xml',`drawing${n}.xml`).replace('printerSettings1.bin',`printerSettings${n}.bin`));
      zip.file(`xl/printerSettings/printerSettings${n}.bin`,prn);
      zip.file(`xl/drawings/drawing${n}.xml`,drw);
      zip.file(`xl/drawings/_rels/drawing${n}.xml.rels`,drwRels.replace('chart1.xml',`chart${n}.xml`));
      ct=ct.replace('</Types>',`<Override PartName="/xl/worksheets/sheet${n}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/drawings/drawing${n}.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/><Override PartName="/xl/charts/chart${n}.xml" ContentType="application/vnd.openxmlformats-officedocument.drawingml.chart+xml"/></Types>`);
      wbRels=wbRels.replace('</Relationships>',`<Relationship Id="rIdTR${n}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${n}.xml"/></Relationships>`);
    }
    sheetsXml+=`<sheet name="${xmlEsc(nom)}" sheetId="${n}" r:id="${i?'rIdTR'+n:'rId1'}"/>`;
    defNames+=`<definedName name="_xlnm.Print_Area" localSheetId="${i}">${xmlEsc(ref)}!$A$1:$AC$59</definedName>`;
  });
  wb=wb.replace(/<sheets>[\s\S]*?<\/sheets>/,`<sheets>${sheetsXml}</sheets>`)
       .replace(/<definedNames>[\s\S]*?<\/definedNames>/,`<definedNames>${defNames}</definedNames>`);
  if(!/fullCalcOnLoad/.test(wb)) wb=wb.replace(/<calcPr\b/,'<calcPr fullCalcOnLoad="1"');
  zip.file('xl/workbook.xml',wb); zip.file('xl/_rels/workbook.xml.rels',wbRels);
  zip.file('[Content_Types].xml',ct); zip.file('xl/styles.xml',st);
  zip.file('docProps/app.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties" xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes"><Application>Microsoft Excel</Application></Properties>');
  return zip.generateAsync({type:'blob',compression:'DEFLATE'});
}

function guardarArchivo(blob,nombre){
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
async function exportar(btn,todos){
  const regs=todos?db.orden.map(id=>db.regs[id]).filter(g=>!g.ejemplo||db.orden.length===1):[db.regs[actual]];
  const lista=regs.map(g=>g.v);
  btn.disabled=true; const txt=btn.textContent; btn.textContent='Generando…';
  try{
    const blob=await construirXlsx(lista);
    const etiqueta=lista.length>1?`${lista.length}_TR_${fechaMX(lista[0].fecha)||''}`:(lista[0].serie||fechaMX(lista[0].fecha)||'sin_serie');
    const nombre=`Formato_TTR_${etiqueta}`.replace(/[\\/:*?"<>|]+/g,'-')+'.xlsx';
    guardarArchivo(blob,nombre); toast('Excel guardado en Descargas: '+nombre);
  }catch(e){toast('No se pudo generar el Excel: '+(e&&e.message||e));}
  finally{btn.disabled=false; btn.textContent=txt;}
}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
render();
